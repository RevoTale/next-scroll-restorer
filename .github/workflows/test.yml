name: Test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'
permissions:
  contents: read
jobs:
  Unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22,24,26]
        nextjs-version: [15,16]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: cd next-app-mock && pnpm i
      - run: pnpm i  && pnpm build
      - run: pnpm add next@^${{ matrix.nextjs-version }}
      - name: Install Playwright browsers
        if: ${{ matrix.node-version != 26 }}
        run: pnpm playwright install --with-deps
      # Playwright 1.58 hangs while extracting browsers under Node 26.
      - name: Use Node 24 for Playwright browser installation
        if: ${{ matrix.node-version == 26 }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Playwright browsers for Node 26 tests
        if: ${{ matrix.node-version == 26 }}
        run: pnpm playwright install --with-deps
      - name: Restore Node 26 for tests
        if: ${{ matrix.node-version == 26 }}
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm test
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        with:
          name: my-artifacts-${{inputs.context}}-${{inputs.job-index}}-${{ matrix.node-version }}-${{ strategy.job-index }}
          path: playwright-report/
      - uses: actions/download-artifact@v8
        with:
          pattern: my-artifacts-${{inputs.context}}*
          merge-multiple: true
  Lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.4.6
      - name: Run Biome
        run: biome ci .
  Types:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i
      - run: pnpm tsc
  Test:
    needs: [ Lint, Unit, Types ]
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "Ready to merge!"
