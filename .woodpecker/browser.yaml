when:
  - event: push
  - event: pull_request
    branch: main

matrix:
  NODE_VERSION: ["22.23.5", "24.22.3", "26.13.1"]
  NEXT: ['15', '16']

steps:
  - name: browser-tests
    image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    environment:
      CI: 'true'
    commands:
      - npm install --global --prefix /tmp/ci-node node@${NODE_VERSION} pnpm@12.3.1
      - export PATH=/tmp/ci-node/bin:$PATH
      - test "$$(node --version)" = 'v${NODE_VERSION}'
      - pnpm --dir next-app-mock install --frozen-lockfile
      - pnpm install --frozen-lockfile
      - pnpm build
      - pnpm --dir next-app-mock add "next@^${NEXT}"
      - pnpm --dir next-app-mock exec node -p "require('next/package.json').version"
      - pnpm add "next@^${NEXT}"
      - pnpm test
